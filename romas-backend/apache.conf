<VirtualHost *:80>
    ServerName localhost

    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Réécriture Laravel directement dans Apache
    RewriteEngine On
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteRule ^ index.php [L]

    # Fallback : toute 404 est envoyée à index.php (Laravel gèrera la route)
    ErrorDocument 404 /index.php

    # En-têtes CORS
    Header set Access-Control-Allow-Origin "https://soft-bridge.netlify.app"
    Header set Access-Control-Allow-Origin "https://softbridge-ruby.vercel.app"
    Header set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
    Header set Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With"
    Header set Access-Control-Allow-Credentials "true"
</VirtualHost>